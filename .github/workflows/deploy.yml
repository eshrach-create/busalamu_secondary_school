name: Build and Deploy
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'
          cache: true
      - name: Recreate Android
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name busalamu_secondary_school
      - name: Fix NDK
        run: |
          python3 -c "
          p='android/app/build.gradle.kts'
          t=open(p).read()
          t=t.replace('compileSdk = 34', 'compileSdk = 34\n    ndkVersion = \"27.0.12077973\"')
          open(p,'w').write(t)
          "
      - name: Install deps
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Build Web
        run: flutter build web --release
      - name: Deploy Web
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web