name: busalamu_secondary_school
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ">=3.0.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  pdf: ^3.10.7
  printing: ^5.11.1
  excel: ^4.0.0
  file_picker: ^8.3.7
  url_launcher: ^6.2.0
  local_auth: ^3.0.2
  geolocator: ^14.0.2
  battery_plus: ^7.1.1
  audioplayers: ^6.8.1
  vibration: ^3.2.1
  firebase_auth: ^6.7.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2

flutter:
  uses-material-design: true
  assets:
    - assets/badge.png
    - assets/sounds/
    
dev_dependencies:
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/badge.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/badge.png"
    background_color: "#0D47A1"
    theme_color: "#0D47A1"